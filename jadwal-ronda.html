<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal & Presensi Ronda</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 15px;
      padding-bottom: 60px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      background: #1e293b;
      color: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 1.4rem;
      margin-bottom: 5px;
    }

    header p {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    .header-row {
      background-color: #0f172a;
      color: white;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-row.group-done {
      background-color: #334155;
    }

    .day-title {
      font-weight: bold;
      font-size: 1.05rem;
    }

    .group-actions {
      display: flex;
      gap: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
    }

    th {
      background-color: #f8fafc;
      color: #64748b;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .num-col {
      width: 35px;
      text-align: center;
      color: #64748b;
    }

    .action-col {
      width: 130px;
      text-align: right;
    }

    tr.is-present {
      background-color: #f0fdf4;
    }

    tr.group-done {
      opacity: 0.7;
    }

    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }

    .btn-hadir {
      background-color: #e2e8f0;
      color: #334155;
    }

    .btn-hadir.active {
      background-color: #22c55e;
      color: white;
    }

    .btn-selesai {
      background-color: #3b82f6;
      color: white;
    }

    .btn-selesai.completed {
      background-color: #64748b;
    }

    .btn-tambah {
      background-color: #f1f5f9;
      color: #0f172a;
      border: 1px dashed #cbd5e1;
    }

    .btn-tambah-ket {
      background-color: #f59e0b;
      color: white;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1rem;
      margin-left: 5px;
      cursor: pointer;
    }

    .ket-row {
      background-color: #fffbebf5;
    }

    .ket-row td {
      padding: 10px 15px;
      color: #b45309;
    }

    .ket-title {
      font-weight: bold;
    }

    .footer-actions {
      text-align: center;
      margin-top: 30px;
    }

    .btn-reset {
      background-color: #ef4444;
      color: white;
      padding: 10px 16px;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }

    .modal-content h3 {
      margin-bottom: 12px;
      font-size: 1.1rem;
    }

    .modal-content textarea {
      width: 100%;
      height: 90px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      margin-bottom: 15px;
      resize: vertical;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-batal {
      background-color: #94a3b8;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Jadwal & Presensi Ronda</h1>
      <p>Sistem Informasi Pos Kamling Online</p>
    </header>

    <!-- KELOMPOK SENIN -->
    <div class="card">
      <div class="header-row" data-group="1">
        <span class="day-title">Senin</span>
        <div class="group-actions">
          <button class="btn btn-tambah" onclick="tambahAnggota('1')">+ Anggota</button>
          <button class="btn btn-tambah-ket" onclick="bukaModalKejadian('1')">+ Keterangan</button>
          <button class="btn btn-selesai" onclick="toggleSelesai('1')">Selesai</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th class="num-col">No</th>
            <th>Nama Warga</th>
            <th class="action-col">Presensi</th>
          </tr>
        </thead>
        <tbody id="group-1">
          <tr data-group="1">
            <td class="num-col">1</td>
            <td class="name-col">BUDI SANTO</td>
            <td class="action-col"><button class="btn btn-hadir" onclick="toggleHadir(this)">Hadir</button></td>
          </tr>
          <tr data-group="1">
            <td class="num-col">2</td>
            <td class="name-col">ANDI WIJAYA</td>
            <td class="action-col"><button class="btn btn-hadir" onclick="toggleHadir(this)">Hadir</button></td>
          </tr>
          <tr data-group="1">
            <td class="num-col">3</td>
            <td class="name-col">AGUS SETIAWAN</td>
            <td class="action-col"><button class="btn btn-hadir" onclick="toggleHadir(this)">Hadir</button></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- KELOMPOK SELASA -->
    <div class="card">
      <div class="header-row" data-group="2">
        <span class="day-title">Selasa</span>
        <div class="group-actions">
          <button class="btn btn-tambah" onclick="tambahAnggota('2')">+ Anggota</button>
          <button class="btn btn-tambah-ket" onclick="bukaModalKejadian('2')">+ Keterangan</button>
          <button class="btn btn-selesai" onclick="toggleSelesai('2')">Selesai</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th class="num-col">No</th>
            <th>Nama Warga</th>
            <th class="action-col">Presensi</th>
          </tr>
        </thead>
        <tbody id="group-2">
          <tr data-group="2">
            <td class="num-col">1</td>
            <td class="name-col">BAMBANG HERMANTO</td>
            <td class="action-col"><button class="btn btn-hadir" onclick="toggleHadir(this)">Hadir</button></td>
          </tr>
          <tr data-group="2">
            <td class="num-col">2</td>
            <td class="name-col">DEDI PRASETYO</td>
            <td class="action-col"><button class="btn btn-hadir" onclick="toggleHadir(this)">Hadir</button></td>
          </tr>
          <tr data-group="2">
            <td class="num-col">3</td>
            <td class="name-col">EKO SURABAYA</td>
            <td class="action-col"><button class="btn btn-hadir" onclick="toggleHadir(this)">Hadir</button></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="footer-actions">
      <button class="btn btn-reset" onclick="resetSemuaCache()">Reset Tampilan Lokal</button>
    </div>
  </div>

  <!-- Modal Tambah Catatan / Keterangan -->
  <div id="modalKet" class="modal">
    <div class="modal-content">
      <h3>Catatan Kejadian / Keterangan</h3>
      <textarea id="modalKetText" placeholder="Masukkan catatan kejadian ronda..."></textarea>
      <div class="modal-buttons">
        <button class="btn btn-batal" onclick="tutupModalKejadian()">Batal</button>
        <button class="btn btn-selesai" onclick="simpanKejadian()">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    const SPREADSHEET_URL = "https://script.google.com/macros/s/AKfycbw_fZ74LiF2U9LomHY7uqiPosQ74VBVd8HPNeaXMeCb60T2tjYp4ggiQUcsmJzZcJqs/exec";

    let activeGroupId = null;

    /* MENGIRIM DATA KE GOOGLE SPREADSHEET */
    function kirimKeSpreadsheet(payload) {
      if (!SPREADSHEET_URL || SPREADSHEET_URL.trim() === "") return;

      fetch(SPREADSHEET_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        console.log("Data berhasil dikirim ke Spreadsheet:", payload);
        setTimeout(ambilDataDariSpreadsheet, 1000);
      })
      .catch(err => console.error("Gagal mengirim ke Spreadsheet:", err));
    }

    /* MENGAMBIL DATA REAL-TIME DARI GOOGLE SPREADSHEET */
    function ambilDataDariSpreadsheet() {
      if (!SPREADSHEET_URL || SPREADSHEET_URL.trim() === "") return;

      fetch(SPREADSHEET_URL)
        .then(response => response.json())
        .then(data => {
          if (Array.isArray(data)) {
            data.forEach(item => {
              const dayTitles = document.querySelectorAll('.day-title');
              dayTitles.forEach(span => {
                if (span.textContent.trim() === item.hariTanggal) {
                  const headerRow = span.closest('.header-row');
                  const groupId = headerRow.getAttribute('data-group');
                  const tbody = document.getElementById(`group-${groupId}`);

                  // 1. Status HADIR
                  if (item.status === "HADIR") {
                    const rows = tbody.querySelectorAll('tr:not(.ket-row)');
                    rows.forEach(row => {
                      const nameCol = row.querySelector('.name-col');
                      if (nameCol && nameCol.textContent.trim() === item.nama.trim()) {
                        const btn = row.querySelector('.btn-hadir');
                        btn.classList.add('active');
                        btn.setAttribute('data-time', item.waktu);
                        btn.textContent = `✓ Hadir (${item.waktu})`;
                        row.classList.add('is-present');
                      }
                    });
                  } 
                  // 2. Status BATAL HADIR
                  else if (item.status === "BATAL HADIR") {
                    const rows = tbody.querySelectorAll('tr:not(.ket-row)');
                    rows.forEach(row => {
                      const nameCol = row.querySelector('.name-col');
                      if (nameCol && nameCol.textContent.trim() === item.nama.trim()) {
                        const btn = row.querySelector('.btn-hadir');
                        btn.classList.remove('active');
                        btn.removeAttribute('data-time');
                        btn.textContent = 'Hadir';
                        row.classList.remove('is-present');
                      }
                    });
                  }

                  // 3. Status RONDA SELESAI
                  if (item.status === "RONDA SELESAI") {
                    const btnSelesai = headerRow.querySelector('.btn-selesai');
                    btnSelesai.classList.add('completed');
                    btnSelesai.setAttribute('data-time', item.waktu);
                    btnSelesai.textContent = `✓ Selesai (${item.waktu})`;
                    headerRow.classList.add('group-done');
                    tbody.querySelectorAll('tr').forEach(r => {
                      r.classList.add('group-done');
                      const hBtn = r.querySelector('.btn-hadir');
                      if(hBtn) hBtn.disabled = true;
                    });
                  }

                  // 4. Status CATATAN KEJADIAN
                  if (item.status === "CATATAN KEJADIAN") {
                    let ketRow = tbody.querySelector('.ket-row');
                    const btnTambahKet = headerRow.querySelector('.btn-tambah-ket');
                    if (!ketRow) {
                      ketRow = document.createElement('tr');
                      ketRow.className = 'ket-row';
                      tbody.appendChild(ketRow);
                    }
                    ketRow.innerHTML = `<td colspan="3"><span class="ket-title">📌 Catatan Kejadian:</span> <span class="ket-text">${escapeHtml(item.keterangan)}</span></td>`;
                    btnTambahKet.textContent = "✏️ Edit Keterangan";
                  }
                }
              });
            });
            saveState();
          }
        })
        .catch(err => console.error("Gagal mengambil data dari Spreadsheet:", err));
    }

    function getWaktuSekarang() {
      const now = new Date();
      const jam = String(now.getHours()).padStart(2, '0');
      const menit = String(now.getMinutes()).padStart(2, '0');
      const detik = String(now.getSeconds()).padStart(2, '0');
      return `${jam}:${menit}:${detik}`;
    }

    function getHariTanggal(groupId) {
      const headerRow = document.querySelector(`.header-row[data-group="${groupId}"]`);
      if (headerRow) {
        const titleEl = headerRow.querySelector('.day-title');
        return titleEl ? titleEl.textContent.trim() : groupId;
      }
      return groupId;
    }

    function tambahAnggota(groupId) {
      const namaBaru = prompt("Masukkan nama anggota baru:");
      if (!namaBaru || namaBaru.trim() === "") return;

      const tbody = document.getElementById(`group-${groupId}`);
      const ketRow = tbody.querySelector('.ket-row');

      const tr = document.createElement('tr');
      tr.setAttribute('data-group', groupId);
      tr.setAttribute('data-custom', 'true');

      tr.innerHTML = `
        <td class="num-col"></td>
        <td class="name-col">${namaBaru.trim().toUpperCase()}</td>
        <td class="action-col">
          <button class="btn btn-hadir" onclick="toggleHadir(this)">Hadir</button>
          <button class="btn btn-delete" onclick="hapusAnggota(this)">✕</button>
        </td>
      `;

      if (ketRow) {
        tbody.insertBefore(tr, ketRow);
      } else {
        tbody.appendChild(tr);
      }

      updateNomorUrut(groupId);
      saveState();
    }

    function hapusAnggota(btn) {
      if (confirm("Apakah Anda yakin ingin menghapus nama ini?")) {
        const row = btn.closest('tr');
        const groupId = row.getAttribute('data-group');
        row.remove();
        updateNomorUrut(groupId);
        saveState();
      }
    }

    function updateNomorUrut(groupId) {
      const rows = document.querySelectorAll(`#group-${groupId} tr:not(.ket-row)`);
      rows.forEach((row, index) => {
        row.querySelector('.num-col').textContent = index + 1;
      });
    }

    function toggleHadir(btn) {
      const row = btn.closest('tr');
      const groupId = row.getAttribute('data-group');
      const namaWarga = row.querySelector('.name-col').textContent.trim();
      const hariTanggal = getHariTanggal(groupId);
      
      const isPresent = btn.classList.toggle('active');
      const waktu = getWaktuSekarang();
      
      if (isPresent) {
        btn.setAttribute('data-time', waktu);
        btn.textContent = `✓ Hadir (${waktu})`;
        row.classList.add('is-present');

        kirimKeSpreadsheet({
          hariTanggal: hariTanggal,
          waktu: waktu,
          nama: namaWarga,
          status: "HADIR",
          keterangan: "Presensi Ronda"
        });
      } else {
        btn.removeAttribute('data-time');
        btn.textContent = 'Hadir';
        row.classList.remove('is-present');

        kirimKeSpreadsheet({
          hariTanggal: hariTanggal,
          waktu: waktu,
          nama: namaWarga,
          status: "BATAL HADIR",
          keterangan: "Status hadir dibatalkan"
        });
      }
      saveState();
    }

    function toggleSelesai(groupId) {
      const headerRow = document.querySelector(`.header-row[data-group="${groupId}"]`);
      const groupRows = document.querySelectorAll(`#group-${groupId} tr`);
      const btn = headerRow.querySelector('.btn-selesai');
      const hariTanggal = getHariTanggal(groupId);
      
      let waktu = btn.getAttribute('data-time') || getWaktuSekarang();
      const isCompleted = btn.classList.toggle('completed');

      if (isCompleted) {
        btn.setAttribute('data-time', waktu);
        btn.textContent = `✓ Selesai (${waktu})`;
        headerRow.classList.add('group-done');
        groupRows.forEach(row => {
          row.classList.add('group-done');
          const hadirBtn = row.querySelector('.btn-hadir');
          if(hadirBtn) hadirBtn.disabled = true;
        });

        kirimKeSpreadsheet({
          hariTanggal: hariTanggal,
          waktu: waktu,
          nama: "-",
          status: "RONDA SELESAI",
          keterangan: "Seluruh rangkaian kegiatan ronda hari ini telah diselesaikan."
        });
      } else {
        btn.removeAttribute('data-time');
        btn.textContent = 'Selesai';
        headerRow.classList.remove('group-done');
        groupRows.forEach(row => {
          row.classList.remove('group-done');
          const hadirBtn = row.querySelector('.btn-hadir');
          if(hadirBtn) hadirBtn.disabled = false;
        });
      }
      saveState();
    }

    function bukaModalKejadian(groupId) {
      activeGroupId = groupId;
      const tbody = document.getElementById(`group-${groupId}`);
      const ketRow = tbody.querySelector('.ket-row .ket-text');
      const text = ketRow ? ketRow.textContent : '';

      document.getElementById('modalKetText').value = text;
      document.getElementById('modalKet').style.display = 'flex';
    }

    function tutupModalKejadian() {
      document.getElementById('modalKet').style.display = 'none';
      activeGroupId = null;
    }

    function simpanKejadian() {
      if (!activeGroupId) return;

      const isi = document.getElementById('modalKetText').value;
      const tbody = document.getElementById(`group-${activeGroupId}`);
      let ketRow = tbody.querySelector('.ket-row');
      const headerRow = document.querySelector(`.header-row[data-group="${activeGroupId}"]`);
      const btnTambahKet = headerRow.querySelector('.btn-tambah-ket');
      const hariTanggal = getHariTanggal(activeGroupId);
      const waktu = getWaktuSekarang();

      if (isi.trim() !== "") {
        if (!ketRow) {
          ketRow = document.createElement('tr');
          ketRow.className = 'ket-row';
          tbody.appendChild(ketRow);
        }
        ketRow.innerHTML = `<td colspan="3"><span class="ket-title">📌 Catatan Kejadian:</span> <span class="ket-text">${escapeHtml(isi.trim())}</span></td>`;
        btnTambahKet.textContent = "✏️ Edit Keterangan";

        kirimKeSpreadsheet({
          hariTanggal: hariTanggal,
          waktu: waktu,
          nama: "-",
          status: "CATATAN KEJADIAN",
          keterangan: isi.trim()
        });
      } else {
        if (ketRow) ketRow.remove();
        btnTambahKet.textContent = "+ Keterangan";
      }

      tutupModalKejadian();
      saveState();
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
    }

    function resetSemuaCache() {
      if (confirm("Apakah Anda yakin ingin menghapus data tersimpan di HP ini?")) {
        localStorage.removeItem('ronda_full_schedule_dated');
        location.reload();
      }
    }

    function saveState() {
      const groupsData = {};

      document.querySelectorAll('tbody[id^="group-"]').forEach(tbody => {
        const groupId = tbody.id.replace('group-', '');
        const rows = [];

        tbody.querySelectorAll('tr:not(.ket-row)').forEach(row => {
          const btnHadir = row.querySelector('.btn-hadir');
          rows.push({
            name: row.querySelector('.name-col').textContent,
            isPresent: btnHadir ? btnHadir.classList.contains('active') : false,
            timeHadir: btnHadir ? btnHadir.getAttribute('data-time') : null,
            isCustom: row.hasAttribute('data-custom')
          });
        });

        const headerRow = document.querySelector(`.header-row[data-group="${groupId}"]`);
        const btnSelesai = headerRow.querySelector('.btn-selesai');
        const ketRow = tbody.querySelector('.ket-row .ket-text');

        groupsData[groupId] = {
          completed: btnSelesai ? btnSelesai.classList.contains('completed') : false,
          timeSelesai: btnSelesai ? btnSelesai.getAttribute('data-time') : null,
          kejadianText: ketRow ? ketRow.textContent : null,
          rows: rows
        };
      });

      localStorage.setItem('ronda_full_schedule_dated', JSON.stringify(groupsData));
    }

    function loadState() {
      const saved = localStorage.getItem('ronda_full_schedule_dated');
      if (saved) {
        const groupsData = JSON.parse(saved);

        Object.keys(groupsData).forEach(groupId => {
          const tbody = document.getElementById(`group-${groupId}`);
          if (!tbody) return;

          const data = groupsData[groupId];
          if (!data || !data.rows) return;

          const existingRows = tbody.querySelectorAll('tr:not(.ket-row)');
          
          data.rows.forEach((rowData, index) => {
            let tr = existingRows[index];

            if (!tr) {
              tr = document.createElement('tr');
              tr.setAttribute('data-group', groupId);
              if (rowData.isCustom) tr.setAttribute('data-custom', 'true');
              tbody.appendChild(tr);
            }

            if (rowData.isPresent) tr.classList.add('is-present');
            if (data.completed) tr.classList.add('group-done');

            const timeStr = rowData.timeHadir ? ` (${rowData.timeHadir})` : '';

            tr.innerHTML = `
              <td class="num-col">${index + 1}</td>
              <td class="name-col">${rowData.name}</td>
              <td class="action-col">
                <button class="btn btn-hadir ${rowData.isPresent ? 'active' : ''}" 
                        ${rowData.timeHadir ? `data-time="${rowData.timeHadir}"` : ''} 
                        ${data.completed ? 'disabled' : ''} 
                        onclick="toggleHadir(this)">
                  ${rowData.isPresent ? `✓ Hadir${timeStr}` : 'Hadir'}
                </button>
                ${rowData.isCustom ? '<button class="btn btn-delete" onclick="hapusAnggota(this)">✕</button>' : ''}
              </td>
            `;
          });

          if (data.kejadianText) {
            let ketRow = tbody.querySelector('.ket-row');
            if (!ketRow) {
              ketRow = document.createElement('tr');
              ketRow.className = 'ket-row';
              tbody.appendChild(ketRow);
            }
            ketRow.innerHTML = `<td colspan="3"><span class="ket-title">📌 Catatan Kejadian:</span> <span class="ket-text">${escapeHtml(data.kejadianText)}</span></td>`;
          }

          const headerRow = document.querySelector(`.header-row[data-group="${groupId}"]`);
          if (headerRow) {
            const selesaiBtn = headerRow.querySelector('.btn-selesai');
            const btnTambahKet = headerRow.querySelector('.btn-tambah-ket');

            if (data.completed) {
              selesaiBtn.classList.add('completed');
              if (data.timeSelesai) selesaiBtn.setAttribute('data-time', data.timeSelesai);
              const timeStr = data.timeSelesai ? ` (${data.timeSelesai})` : '';
              selesaiBtn.textContent = `✓ Selesai${timeStr}`;
              headerRow.classList.add('group-done');
            }

            if (data.kejadianText) {
              btnTambahKet.textContent = "✏️ Edit Keterangan";
            }
          }
        });
      }

      // Memanggil data Google Sheets real-time saat halaman pertama dimuat
      ambilDataDariSpreadsheet();
    }

    // Inisialisasi awal & polling setiap 10 detik
    document.addEventListener('DOMContentLoaded', () => {
      loadState();
      setInterval(ambilDataDariSpreadsheet, 10000);
    });
  </script>
</body>
</html>
