 <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JADWAL RONDA RT 02 RW 17</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
    body { background-color: #ffffff; padding: 20px; display: flex; justify-content: center; }
    
    .container { width: 100%; max-width: 800px; }
    
    /* Judul Utama */
    h1.title { text-align: center; font-size: 26px; font-weight: bold; margin-bottom: 12px; letter-spacing: 0.5px; }
    hr.divider { border: 0; height: 2px; background: #333; margin-bottom: 25px; }

    /* Baris Header / Info & Tombol */
    .header-bar {
      background-color: #2c3e50;
      color: white;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
      font-weight: bold;
      font-size: 16px;
    }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-group button {
      border: none;
      border-radius: 4px;
      color: white;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-tambah { background-color: #2ec4b6; }
    .btn-ket { background-color: #ff9f1c; }
    .btn-selesai { background-color: #8e44ad; }
    .btn-reset { background-color: #e74c3c; }

    /* Tabel */
    table { width: 100%; border-collapse: collapse; background: white; }
    table, th, td { border: 1px solid #ccc; }
    td { padding: 12px 15px; font-size: 16px; font-weight: bold; vertical-align: middle; }
    
    .col-no { width: 50px; text-align: center; font-size: 18px; }
    .col-nama { text-transform: uppercase; letter-spacing: 0.5px; }
    .col-action { width: 160px; text-align: center; }

    /* Tombol Hadir */
    .btn-hadir {
      background-color: #e0e0e0;
      border: 1px solid #b5b5b5;
      color: #333;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      display: block;
      position: relative;
      z-index: 1;
    }
    .btn-hadir.active {
      background-color: #2ed573 !important;
      color: white !important;
      border-color: #26af5f !important;
    }

    /* Modal Pop-up */
    .modal { 
      display: none; 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(0,0,0,0.5); 
      justify-content: center; 
      align-items: center; 
      z-index: 999; 
    }
    .modal-content { background: white; padding: 20px; border-radius: 6px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .modal-content h3 { margin-bottom: 12px; font-size: 16px; }
    .modal-content input, .modal-content textarea { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>

<div class="container">
  <h1 class="title">JADWAL RONDA RT 02 RW 17</h1>
  <hr class="divider">

  <div class="header-bar">
    <span id="tanggal-hari-ini">Selasa, 28-07-2026</span>
    <div class="btn-group">
      <button class="btn-tambah" onclick="bukaModal('modalTambah')">+ Tambah Nama</button>
      <button class="btn-ket" onclick="bukaModal('modalKet')">+ Keterangan</button>
      <button class="btn-selesai" onclick="aksiSelesai()">Selesai</button>
      <button class="btn-reset" onclick="aksiReset()">Reset Hari Ini</button>
    </div>
  </div>

  <table>
    <tbody id="tabel-ronda">
      <tr>
        <td class="col-no">1</td>
        <td class="col-nama">PENDI SUHENDI</td>
        <td class="col-action"><button type="button" class="btn-hadir" onclick="toggleHadir(this)">Hadir</button></td>
      </tr>
      <tr>
        <td class="col-no">2</td>
        <td class="col-nama">DEDE SATIM</td>
        <td class="col-action"><button type="button" class="btn-hadir" onclick="toggleHadir(this)">Hadir</button></td>
      </tr>
      <tr>
        <td class="col-no">3</td>
        <td class="col-nama">WAHAB</td>
        <td class="col-action"><button type="button" class="btn-hadir" onclick="toggleHadir(this)">Hadir</button></td>
      </tr>
      <tr>
        <td class="col-no">4</td>
        <td class="col-nama">RUSDI</td>
        <td class="col-action"><button type="button" class="btn-hadir" onclick="toggleHadir(this)">Hadir</button></td>
      </tr>
      <tr>
        <td class="col-no">5</td>
        <td class="col-nama">ASEP MEKA</td>
        <td class="col-action"><button type="button" class="btn-hadir" onclick="toggleHadir(this)">Hadir</button></td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal Tambah Nama -->
<div id="modalTambah" class="modal">
  <div class="modal-content">
    <h3>Tambah Nama Petugas Ronda</h3>
    <input type="text" id="inputNamaBaru" placeholder="Masukkan nama...">
    <div class="modal-actions">
      <button class="btn-tambah" style="padding: 6px 12px;" onclick="tambahNama()">Simpan</button>
      <button onclick="tutupModal('modalTambah')" style="padding: 6px 12px; background:#ccc; border:none; border-radius:4px;">Batal</button>
    </div>
  </div>
</div>

<!-- Modal Keterangan Kejadian -->
<div id="modalKet" class="modal">
  <div class="modal-content">
    <h3>Laporan / Keterangan</h3>
    <textarea id="inputKejadian" rows="3" placeholder="Tulis catatan/kejadian..."></textarea>
    <div class="modal-actions">
      <button class="btn-ket" style="padding: 6px 12px;" onclick="simpanKeterangan()">Kirim</button>
      <button onclick="tutupModal('modalKet')" style="padding: 6px 12px; background:#ccc; border:none; border-radius:4px;">Batal</button>
    </div>
  </div>
</div>

<script>
  const SPREADSHEET_URL = "https://script.google.com/macros/s/AKfycbw07X46do2rGRBYr5jc7NNhN_ze6ZFe0aWMKy6wGqA_Thr8QSTNuwNekoYJFW8TJbIgPQ/exec";

  function getWaktuSekarang() {
    const now = new Date();
    return String(now.getHours()).padStart(2, '0') + ':' + 
           String(now.getMinutes()).padStart(2, '0') + ':' + 
           String(now.getSeconds()).padStart(2, '0');
  }

  function getHariTanggal() {
    return document.getElementById('tanggal-hari-ini').textContent.trim();
  }

  function kirimKeSpreadsheet(payload) {
    if (!SPREADSHEET_URL) return;
    fetch(SPREADSHEET_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => setTimeout(sinkronkanData, 1500))
    .catch(err => console.error("Gagal mengirim data:", err));
  }

  function sinkronkanData() {
    if (!SPREADSHEET_URL) return;
    fetch(SPREADSHEET_URL)
      .then(res => res.json())
      .then(response => {
        if (response.status === "success" && response.data) {
          updateTampilanDariSheet(response.data);
        }
      })
      .catch(err => console.error("Gagal membaca data:", err));
  }

  function updateTampilanDariSheet(rowsData) {
    const hariTanggalHTML = getHariTanggal();

    for (let i = 1; i < rowsData.length; i++) {
      const row = rowsData[i];
      const hariTanggalSheet = row[1];
      const jamAction = row[2];
      const namaSheet = row[3];
      const statusSheet = row[4];

      if (!namaSheet || !statusSheet) continue;

      document.querySelectorAll('#tabel-ronda tr').forEach(tr => {
        const nameCol = tr.querySelector('.col-nama');
        if (nameCol && nameCol.textContent.trim().toUpperCase() === namaSheet.trim().toUpperCase() && hariTanggalHTML === hariTanggalSheet) {
          const btnHadir = tr.querySelector('.btn-hadir');
          if (btnHadir) {
            if (statusSheet === "HADIR") {
              btnHadir.classList.add('active');
              btnHadir.textContent = `✓ Hadir (${jamAction})`;
            } else if (statusSheet === "BATAL HADIR") {
              btnHadir.classList.remove('active');
              btnHadir.textContent = 'Hadir';
            }
          }
        }
      });
    }
  }

  function bukaModal(id) { document.getElementById(id).style.display = 'flex'; }
  function tutupModal(id) { document.getElementById(id).style.display = 'none'; }

  // Fungsi Klik Tombol Hadir
  function toggleHadir(btn) {
    const row = btn.closest('tr');
    const namaWarga = row.querySelector('.col-nama').textContent.trim();
    const isPresent = btn.classList.toggle('active');
    const waktu = getWaktuSekarang();

    if (isPresent) {
      btn.textContent = `✓ Hadir (${waktu})`;
      kirimKeSpreadsheet({
        hariTanggal: getHariTanggal(),
        waktu: waktu,
        nama: namaWarga,
        status: "HADIR",
        keterangan: "Presensi Ronda"
      });
    } else {
      btn.textContent = 'Hadir';
      kirimKeSpreadsheet({
        hariTanggal: getHariTanggal(),
        waktu: waktu,
        nama: namaWarga,
        status: "BATAL HADIR",
        keterangan: "Status hadir dibatalkan"
      });
    }
  }

  function tambahNama() {
    const nama = document.getElementById('inputNamaBaru').value;
    if (!nama) return alert('Nama tidak boleh kosong');
    
    const tbody = document.getElementById('tabel-ronda');
    const totalRow = tbody.rows.length + 1;
    
    const newRow = `
      <tr>
        <td class="col-no">${totalRow}</td>
        <td class="col-nama">${nama.toUpperCase()}</td>
        <td class="col-action"><button type="button" class="btn-hadir" onclick="toggleHadir(this)">Hadir</button></td>
      </tr>
    `;
    tbody.insertAdjacentHTML('beforeend', newRow);
    document.getElementById('inputNamaBaru').value = '';
    tutupModal('modalTambah');
  }

  function simpanKeterangan() {
    const text = document.getElementById('inputKejadian').value;
    if (!text) return alert('Keterangan tidak boleh kosong');

    kirimKeSpreadsheet({
      hariTanggal: getHariTanggal(),
      waktu: getWaktuSekarang(),
      nama: "-",
      status: "CATATAN KEJADIAN",
      keterangan: text
    });

    alert('Keterangan disimpan: ' + text);
    document.getElementById('inputKejadian').value = '';
    tutupModal('modalKet');
  }

  function aksiReset() {
    if (confirm('Apakah Anda yakin ingin mereset kehadiran hari ini?')) {
      const btns = document.querySelectorAll('.btn-hadir');
      btns.forEach(b => {
        b.classList.remove('active');
        b.textContent = 'Hadir';
      });
    }
  }

  function aksiSelesai() {
    kirimKeSpreadsheet({
      hariTanggal: getHariTanggal(),
      waktu: getWaktuSekarang(),
      nama: "-",
      status: "RONDA SELESAI",
      keterangan: "Seluruh kegiatan ronda selesai"
    });
    alert('Jadwal ronda hari ini diselesaikan!');
  }

  document.addEventListener('DOMContentLoaded', sinkronkanData);
  setInterval(sinkronkanData, 5000);
</script>

</body>
</html>
